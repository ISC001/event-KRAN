<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Diubah agar mengizinkan pengguna melakukan zoom (cubit layar) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Kompetisi Roket Air Nasional 2026</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
        }

        h2 {
            margin: 15px 0;
            text-align: center;
            font-size: 1.2rem;
            color: #333;
        }

        /* Container agar tabel bisa digeser ke samping jika terlalu lebar di HP */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Menggunakan embed versi CSV/HTML sederhana atau iframe biasa dengan lebar penuh */
        iframe {
            width: 100%;
            height: 85vh;
            min-height: 500px;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
   
    <div class="table-responsive">
        <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTvxgZ3_xbZbN5g07ttMZ4uOy1ItZm15B9y1ZEkiu_tb7289ZDayP3q2EJ14obo5r7H3TmZwXVU99Xc/pubhtml?widget=true&amp;headers=false"></iframe>
    </div>

</body>
</html>

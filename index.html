<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kompetisi Roket Air Nasional 2026</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
        }

        h2 {
            margin: 15px 0;
            text-align: center;
            font-size: 1.2rem;
            color: #333;
        }

        /* Container untuk membungkus iframe dan memotong bagian atasnya */
        .iframe-container {
            width: 100%;
            height: 85vh;
            min-height: 600px;
            overflow: hidden; /* Bagian yang keluar dari kotak akan disembunyikan */
            position: relative;
        }

        /* Iframe digeser ke atas agar judul file GSheet tersembunyi di luar kotak */
        iframe {
            width: 100%;
            height: calc(100% + 50px); /* Dilebihkan tingginya */
            position: absolute;
            top: -45px; /* Ditarik ke atas sebesar 45px untuk menutupi nama file */
            left: 0;
            border: none;
        }
    </style>
</head>
<body>   
    <div class="iframe-container">
        <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTvxgZ3_xbZbN5g07ttMZ4uOy1ItZm15B9y1ZEkiu_tb7289ZDayP3q2EJ14obo5r7H3TmZwXVU99Xc/pubhtml?widget=true&amp;headers=false&amp;rm=minimal"></iframe>
    </div>

</body>
</html>
